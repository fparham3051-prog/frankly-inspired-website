# Outage alert: every two hours from 7am to 8pm Eastern, check what a
# prospect touches first: the public site and the API that takes check-up
# results. A failed run means something is down; GitHub emails the
# failure. The API is on Render's free plan and sleeps, so it gets up to
# two minutes to wake (this also wakes it before people arrive).
name: Uptime check

on:
  schedule:
    - cron: "7 12-23/2,1 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Public site is up and current
        run: |
          for i in 1 2; do
            if curl -fsS -m 30 https://franklyinspired.associates/ | grep -q "From idea to legacy"; then echo "site ok"; exit 0; fi
            sleep 30
          done
          echo "::error::franklyinspired.associates is down or not serving the current page"; exit 1
      - name: Check-up results API answers
        run: |
          for i in 1 2; do
            if curl -fsS -m 120 https://frankly-inspired-api.onrender.com/api/health; then echo; echo "api ok"; exit 0; fi
            sleep 30
          done
          echo "::error::frankly-inspired-api is not answering; check-up results can't be emailed"; exit 1
      - name: Scoring model is published
        run: |
          curl -fsS -m 30 https://franklyinspired.associates/scoring-model.json | python3 -c "import json,sys; d=json.load(sys.stdin); assert set(d['stages'])=={'BUILD','FUND','SUSTAIN'}; print('model ok')"
